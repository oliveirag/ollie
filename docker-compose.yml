services:
  postgres:
    image: postgres:16
    container_name: ollie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ollie
      POSTGRES_PASSWORD: ollie
      POSTGRES_DB: ollie
    ports:
      - "5432:5432"
    volumes:
      - ollie-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ollie -d ollie"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ollie-pgdata:

        - symbol
        - side
        - quantity
        - entry_price
        - opened_at
        - latest_mark
      additionalProperties: false
    SubscriberTrackRecord:
      type: object
      properties:
        closed_trades:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        open_positions:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Reported alongside win rate so the exclusion below is visible, not hidden
        wins:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Strictly positive realized PnL; a scratch is not a win
        win_rate:
          type: number
          nullable: true
          description: Wins over closed trades. Open positions are excluded from the denominator because they have no outcome yet. Null with zero closed trades — no answer, rather than a claimed 0%
        average_return:
          type: number
          nullable: true
          description: Unweighted mean of realized_pnl / (entry_price x quantity) over closed trades
        total_realized_pnl:
          type: string
          description: Decimal string, two places
        curve:
          type: array
          items:
            $ref: "#/components/schemas/CurvePoint"
          description: A PnL curve based at zero, not a portfolio value
        positions:
          type: array
          items:
            $ref: "#/components/schemas/OpenPosition"
          description: Open lots at daily-mark granularity. Same rows the curve is drawn from.
      required:
        - closed_trades
        - open_positions
        - wins
        - win_rate
        - average_return
        - total_realized_pnl
        - curve
        - positions
      additionalProperties: false
    SignalHealth:

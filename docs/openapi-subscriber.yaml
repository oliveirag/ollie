# Generated from the zod route schemas. Do not edit by hand.
#
# Regenerate with:  npm run openapi:write
# The drift test (test/openapi.drift.test.ts) fails if this file falls behind
# the routes, which is how a Swift client and a Node handler stay in sync.
#
# Emitted as OpenAPI 3.0.3 with `nullable: true` rather than 3.1's
# `anyOf: [X, {type: "null"}]`: swift-openapi-generator does not support the
# 3.1 null type and drops nullable properties from the generated client
# entirely. See toOpenApi30 in src/server/openapi.ts.
openapi: 3.0.3
info:
  title: Ollie Signal API
  version: 0.1.0
  description: |-
    Subscriber-facing API for the Ollie signal feed.

    `POST /v1/session` is public and turns a Sign in with Apple identity token into an app session token; everything else under /v1 requires that token as a bearer. `/healthz` is public. The MCP endpoint at `/mcp` takes a separately minted MCP token and is not described by this document.

    Nothing here can place, modify, or read an order on any brokerage account. Every response is identical for every subscriber.
components:
  securitySchemes:
    subscriberToken:
      type: http
      scheme: bearer
      description: The app session token from POST /v1/session. Per-subscriber, hashed at rest, revocable. Not accepted at /mcp, which takes an MCP token.
  schemas:
    SessionRequestInput:
      type: object
      properties:
        identity_token:
          type: string
          minLength: 1
          description: The Sign in with Apple identity token, verbatim from ASAuthorization
        invite_code:
          description: Required on the first sign-in while the soft launch is invite-gated
          type: string
          maxLength: 64
      required:
        - identity_token
    AcceptDisclaimerRequestInput:
      type: object
      properties:
        version:
          type: string
          description: The version the client displayed; must match the current one
      required:
        - version
    SignalSide:
      type: string
      enum:
        - buy
        - sell
    SignalStatus:
      type: string
      enum:
        - pending
        - approved
        - rejected
        - expired
    SignalType:
      type: string
      enum:
        - technical
        - rebalance
        - time_stop
      description: time_stop is an exit proposed by the holding-period rule. It consults no indicator, so its `indicators` payload carries bars_held and max_holding_period_bars rather than RSI and MACD figures.
    ThesisSource:
      type: string
      enum:
        - llm
        - fallback_template
    Error:
      type: object
      properties:
        error:
          type: string
        detail:
          type: string
        status:
          $ref: "#/components/schemas/SignalStatus"
      required:
        - error
      additionalProperties: false
      description: Error response
    CurvePoint:
      type: object
      properties:
        date:
          type: string
          description: UTC calendar day, YYYY-MM-DD
        value:
          type: number
          nullable: true
          description: Cumulative realized PnL through this day plus the day's marks. Null when withheld
        withheld:
          type: boolean
          description: True when a lot open on this day had no mark, so no honest total exists. A partial sum would misstate a published curve, so the day is reported as absent rather than approximated
      required:
        - date
        - value
        - withheld
      additionalProperties: false
    PublishedSignal:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        created_at:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
          description: When the signal fired
        published_at:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
          description: When it reached the feed — after the owner's own fill was recorded, never before
        symbol:
          type: string
        side:
          $ref: "#/components/schemas/SignalSide"
        signal_type:
          $ref: "#/components/schemas/SignalType"
        quantity:
          type: string
          description: Whole shares the owner's strategy sized. Not a recommendation for anyone else's size.
        thesis:
          type: string
          nullable: true
        thesis_source:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ThesisSource"
        indicators:
          description: Every input the rule read, thresholds included, so the decision can be replayed
        estimated_price:
          type: string
          description: |-
            Decimal number as a string. Never parse this into a float.

            Stored prices are serialized verbatim from the database, so trailing zeros are not padded — "100" and "100.00" are the same value, and a fill of "182.6825" keeps all four places. Computed aggregates are fixed at two. Format for display on the client; do not assume a decimal-place count.
          nullable: true
      required:
        - id
        - created_at
        - published_at
        - symbol
        - side
        - signal_type
        - quantity
        - thesis
        - thesis_source
        - indicators
        - estimated_price
      additionalProperties: false
    Subscriber:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        email:

      required:
        - id
        - email
        - created_at
      additionalProperties: false
    Session:
      type: object
      properties:
        token:
          type: string
          description: The app session bearer token. Store it in the Keychain; it is not shown again.
        subscriber:
          $ref: "#/components/schemas/Subscriber"
      required:
        - token
        - subscriber
      additionalProperties: false
    Disclaimer:
      type: object
      properties:
        version:
          type: string
          description: sha256 of the text. Send it back on accept.
        text:
          type: string
          description: Markdown
      required:
        - version
        - text
      additionalProperties: false
    Onboarding:
      type: object
      properties:
        disclaimer:
          $ref: "#/components/schemas/Disclaimer"
        accepted_current_version:
          type: boolean
          description: Whether this subscriber has an acceptance row for the version above
        has_mcp_token:
          type: boolean
          description: Whether an unrevoked MCP token exists
        mcp_url:
          type: string
          nullable: true
          description: Where to point an agent. Null only when the service has no public URL configured.
      required:
        - disclaimer
        - accepted_current_version
        - has_mcp_token
        - mcp_url
      additionalProperties: false

            - down
        uptimeSeconds:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        checkedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - status
        - database
        - uptimeSeconds
        - checkedAt
      additionalProperties: false
paths:
  /healthz:
    get:
      operationId: getSignalHealth
      summary: Liveness check
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalHealth"
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalHealth"
  /v1/session:
    post:
      operationId: createSession
      summary: Sign in with Apple and receive an app session token
      tags:
        - onboarding
      description: |-
        Verifies the identity token against Apple's keys, then finds or creates the subscriber by Apple subject. A first sign-in needs a valid invite code while the soft launch is gated; a returning subscriber does not.

        The token in the response is the only time it is shown.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRequestInput"
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: The request failed schema validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: The identity token did not verify
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: First sign-in without a valid invite code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/onboarding:
    get:
      operationId: getOnboarding
      summary: Where this subscriber is in onboarding, from rows
      tags:
        - onboarding
      security:
        - subscriberToken: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Onboarding"
        "401":
          description: Missing or invalid app token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/disclaimer/accept:
    post:
      operationId: acceptDisclaimer
      summary: Record that this subscriber accepted the disclaimer
      tags:
        - onboarding
      description: "The version must be the one currently served. A mismatch means the text changed under the client: re-fetch onboarding, re-display, and accept the new version."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptDisclaimerRequestInput"
      security:
        - subscriberToken: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisclaimerAcceptance"
        "400":
          description: The request failed schema validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid app token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The version accepted is not the version served
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/mcp-tokens:
    post:
      operationId: mintMcpToken
      summary: Mint an agent-facing MCP token
      tags:
        - tokens
      description: Refused with 409 until the current disclaimer version has been accepted — the credential cannot exist without the consent row predating it. The plaintext is returned once; only its hash is stored. Lost it? Revoke and mint again.
      security:
        - subscriberToken: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpTokenMinted"
        "401":
          description: Missing or invalid app token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The current disclaimer has not been accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: listMcpTokens
      summary: This subscriber's MCP tokens, never the plaintext
      tags:
        - tokens
      security:
        - subscriberToken: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpTokenList"
        "401":
          description: Missing or invalid app token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/mcp-tokens/{id}:
    delete:
      operationId: revokeMcpToken
      summary: Revoke an MCP token
      tags:
        - tokens
      description: Idempotent. The row remains as history with `revoked_at` set.
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: id
          required: true
      security:
        - subscriberToken: []
      responses:
        "204":
          description: Revoked, or already was
        "400":
          description: The request failed schema validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid app token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such token belongs to this subscriber
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/feed:
    get:
      operationId: getFeed
      summary: Published signals, newest first
      tags:
        - feed
      description: Only signals the owner approved and whose fill was recorded appear here, and they appear only after that fill. Rejected and expired proposals are not signals. The payload is identical for every subscriber.
      parameters:
        - schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 100
          in: query
          name: limit
          required: false
        - schema:
            type: string
            format: date-time
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
          in: query
          name: before
          required: false
          description: "Keyset cursor: return signals published strictly before this instant"
      security:
        - subscriberToken: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feed"
        "400":
          description: The request failed schema validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid app token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/signals/{id}:
    get:
      operationId: getPublishedSignal
      summary: One published signal and its full per-signal record
      tags:
        - feed
      description: "The record rows are the recompute path: entry, every daily mark with the price it was taken at, the close, and any correction. An unpublished or unknown id returns the same 404, on purpose."
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: id
          required: true
      security:
        - subscriberToken: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedSignalDetail"
        "400":
          description: The request failed schema validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid app token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No published signal with that id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/track-record:
    get:
      operationId: getSubscriberTrackRecord
      summary: Performance to date, the curve, and open positions at daily marks
      tags:
        - feed
      description: "Byte-for-byte the owner's numbers: the same pure function over the same append-only rows, computed at read time. Open positions carry their latest daily mark and its date — there is no live quote on this side of the wall, by design."
      security:
        - subscriberToken: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriberTrackRecord"
        "401":
          description: Missing or invalid app token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
servers:
  - url: http://localhost:3100
    description: Local development
  - url: https://ollie-signal.up.railway.app
    description: Railway

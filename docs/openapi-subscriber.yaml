              description: When the mark was taken — the prior close, not now
            days_held:
              type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
              description: Calendar days from opened_at to as_of
          required:
            - price
            - unrealized_pnl
            - as_of
            - days_held
          additionalProperties: false
          nullable: true
          description: Null when the lot has never been marked. There is no live quote here by design.
      required:

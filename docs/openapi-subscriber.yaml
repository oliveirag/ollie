    PublishedSignalDetail:
      type: object
      properties:
        signal:
          $ref: "#/components/schemas/PublishedSignal"
        record:
          type: array
          items:
            $ref: "#/components/schemas/RecordRow"
          description: "Every track-record row for this signal, oldest first. Append-only: a later row supersedes an earlier one, never edits it."
      required:
        - signal
        - record
      additionalProperties: false
    OpenPosition:
      type: object
      properties:
        signal_id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        symbol:
          type: string
        side:
          $ref: "#/components/schemas/SignalSide"
        quantity:
          type: string
          description: |-
            Decimal number as a string. Never parse this into a float.

            Stored prices are serialized verbatim from the database, so trailing zeros are not padded — "100" and "100.00" are the same value, and a fill of "182.6825" keeps all four places. Computed aggregates are fixed at two. Format for display on the client; do not assume a decimal-place count.
        entry_price:
          type: string
          description: |-
            Decimal number as a string. Never parse this into a float.

            Stored prices are serialized verbatim from the database, so trailing zeros are not padded — "100" and "100.00" are the same value, and a fill of "182.6825" keeps all four places. Computed aggregates are fixed at two. Format for display on the client; do not assume a decimal-place count.
        opened_at:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        latest_mark:
          type: object
          properties:
            price:
              type: string
              description: |-
                Decimal number as a string. Never parse this into a float.

                Stored prices are serialized verbatim from the database, so trailing zeros are not padded — "100" and "100.00" are the same value, and a fill of "182.6825" keeps all four places. Computed aggregates are fixed at two. Format for display on the client; do not assume a decimal-place count.
            unrealized_pnl:
              type: string
              description: |-
                Decimal number as a string. Never parse this into a float.

                Stored prices are serialized verbatim from the database, so trailing zeros are not padded — "100" and "100.00" are the same value, and a fill of "182.6825" keeps all four places. Computed aggregates are fixed at two. Format for display on the client; do not assume a decimal-place count.

# Generated from the zod route schemas. Do not edit by hand.
#
# Regenerate with:  npm run openapi:write
# The drift test (test/openapi.drift.test.ts) fails if this file falls behind
# the routes, which is how a Swift client and a Node handler stay in sync.
openapi: 3.1.0
info:
  title: Ollie Orchestrator API
  version: 0.2.0
  description: |-
    Owner-facing API for the Ollie trading-signal orchestrator.

    Every route under /v1 requires the owner bearer token. `/healthz` is public so the platform health check can reach it.

    The subscriber-facing signal feed is a separate read-only MCP server in Phase 4 and is not described by this document.
components:
  securitySchemes:
    ownerToken:
      type: http
      scheme: bearer
      description: The pre-shared owner token (OWNER_API_TOKEN). Phase 2 has one user; Sign in with Apple arrives in Phase 4 with the subscriber side.
  schemas:
    ExecutionModeInput:
      type: string
      enum:
        - paper
        - live
    DecisionRequestInput:
      type: object
      properties:
        action:
          type: string
          enum:
            - approve
            - reject
        reason:
          type: string
          maxLength: 500
      required:
        - action
    SettingsUpdateInput:
      type: object
      properties:
        kill_switch:
          type: boolean
        execution_mode:
          $ref: "#/components/schemas/ExecutionModeInput"
    SignalSide:
      type: string
      enum:
        - buy
        - sell
    SignalStatus:
      type: string
      enum:
        - pending
        - approved
        - rejected
        - expired
    SignalType:
      type: string
      enum:
        - technical
        - rebalance
    ExecutionMode:
      type: string
      enum:
        - paper
        - live
    ThesisSource:
      type: string
      enum:
        - llm
        - fallback_template
    Error:
      type: object
      properties:
        error:
          type: string
        detail:
          type: string
        status:
          $ref: "#/components/schemas/SignalStatus"
      required:
        - error
      additionalProperties: false
      description: Error response
    ReviewAlert:
      type: object
      properties:
        type:
          type: string
          description: Broker alert code, e.g. EQUITY_NOT_ENOUGH_BP
        details:
          description: Broker-supplied payload; shape is not ours to declare
      required:
        - type
        - details
      additionalProperties: false
    SignalSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        created_at:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        symbol:
          type: string
        side:
          $ref: "#/components/schemas/SignalSide"
        signal_type:
          $ref: "#/components/schemas/SignalType"
        quantity:
          type: string
          description: |-
            Decimal number as a string. Never parse this into a float.

            Stored prices are serialized verbatim from the database, so trailing zeros are not padded — "100" and "100.00" are the same value, and a fill of "182.6825" keeps all four places. Computed aggregates are fixed at two. Format for display on the client; do not assume a decimal-place count.
        status:
          $ref: "#/components/schemas/SignalStatus"
        execution_mode:
          $ref: "#/components/schemas/ExecutionMode"
        estimated_price:
          anyOf:
            - type: string
              description: |-
                Decimal number as a string. Never parse this into a float.

                Stored prices are serialized verbatim from the database, so trailing zeros are not padded — "100" and "100.00" are the same value, and a fill of "182.6825" keeps all four places. Computed aggregates are fixed at two. Format for display on the client; do not assume a decimal-place count.
            - type: "null"
          description: From the review snapshot at proposal time; null if unreadable
        thesis:
          anyOf:
            - type: string
            - type: "null"
        thesis_source:
          anyOf:
            - $ref: "#/components/schemas/ThesisSource"
            - type: "null"
          description: null when the stored value is not one the app knows how to render. The app uses this to mark a fallback-template thesis, so an unrecognized value must not be shown as "llm".
        expires_at:
          anyOf:
            - type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
            - type: "null"
          description: created_at + SIGNAL_EXPIRY_MINUTES, computed at read time, for pending signals only. The expiry sweep remains the authority; this is a countdown hint, not a promise.
        decided_at:
          anyOf:
            - type: string
              format: date-time
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
            - type: "null"
        decide_reason:
          anyOf:
            - type: string
            - type: "null"
      required:
        - id
        - created_at
        - symbol
        - side
        - signal_type
        - quantity
        - status
        - execution_mode
        - estimated_price
        - thesis
        - thesis_source
        - expires_at
        - decided_at
        - decide_reason
      additionalProperties: false
    SignalList:
      type: object
      properties:
        signals:
          type: array
          items:
            $ref: "#/components/schemas/SignalSummary"
      required:
        - signals
      additionalProperties: false
    SignalEvent:
      type: object
      properties:
        from_status:
          $ref: "#/components/schemas/SignalStatus"
        to_status:
          $ref: "#/components/schemas/SignalStatus"
        reason:

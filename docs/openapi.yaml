# Generated from the zod route schemas. Do not edit by hand.
#
# Regenerate with:  npm run openapi:write
# The drift test (test/openapi.drift.test.ts) fails if this file falls behind
# the routes, which is how a Swift client and a Node handler stay in sync.
#
# Emitted as OpenAPI 3.0.3 with `nullable: true` rather than 3.1's
# `anyOf: [X, {type: "null"}]`: swift-openapi-generator does not support the
# 3.1 null type and drops nullable properties from the generated client
# entirely. See toOpenApi30 in src/server/openapi.ts.
openapi: 3.0.3
info:
  title: Ollie Orchestrator API
  version: 0.2.0
  description: |-
    Owner-facing API for the Ollie trading-signal orchestrator.

    Every route under /v1 requires the owner bearer token. `/healthz` is public so the platform health check can reach it.

    The subscriber-facing signal feed is a separate read-only MCP server in Phase 4 and is not described by this document.
components:
  securitySchemes:
    ownerToken:
      type: http
      scheme: bearer
      description: The pre-shared owner token (OWNER_API_TOKEN). Phase 2 has one user; Sign in with Apple arrives in Phase 4 with the subscriber side.
  schemas:
    ExecutionModeInput:
      type: string
      enum:
        - paper
        - live
    DecisionRequestInput:
      type: object
      properties:
        action:
          type: string
          enum:
            - approve
            - reject
        reason:
          type: string
          maxLength: 500
        confirm_live:
          description: "Phase 5: must be true to approve a live-mode signal — the per-approval confirmation PRD §4.2 asks for. Only the live confirmation sheet sends it."
          type: boolean
      required:
        - action
    SettingsUpdateInput:
      type: object
      properties:
        kill_switch:
          type: boolean
        execution_mode:
          $ref: "#/components/schemas/ExecutionModeInput"
        autonomy:
          type: boolean
    DeviceRegistrationInput:
      type: object
      properties:
        apns_token:
          type: string
          minLength: 1
        environment:
          default: production
          description: Sandbox for development builds; a token is only valid against one of the two
          type: string
          enum:
            - sandbox
            - production
      required:
        - apns_token
    SignalSide:
      type: string
      enum:
        - buy
        - sell
    SignalStatus:
      type: string
      enum:
        - pending
        - approved
        - rejected
        - expired
    SignalType:
      type: string
      enum:
        - technical
        - rebalance
        - time_stop
      description: time_stop is an exit proposed by the holding-period rule. It consults no indicator, so its `indicators` payload carries barsHeld and maxHoldingDays rather than RSI and MACD figures.
    ExecutionMode:
      type: string
      enum:
        - paper
        - live
    ThesisSource:
      type: string
      enum:
        - llm
        - fallback_template
    Error:
      type: object
      properties:
        error:
          type: string
        detail:
          type: string
        status:
          $ref: "#/components/schemas/SignalStatus"
      required:
        - error
      additionalProperties: false
      description: Error response
    ReviewAlert:
      type: object
      properties:
        type:
          type: string
          description: Broker alert code, e.g. EQUITY_NOT_ENOUGH_BP
        details:
          description: Broker-supplied payload; shape is not ours to declare
      required:
        - type
        - details
      additionalProperties: false
    Order:
      type: object
      properties:
        broker_order_id:
          type: string
        state:
          type: string
          description: "The broker's state, verbatim: new, queued, confirmed, unconfirmed, partially_filled, filled, cancelled, rejected, failed, voided"
        cumulative_quantity:
          type: string
          description: |-
            Decimal number as a string. Never parse this into a float.

            Stored prices are serialized verbatim from the database, so trailing zeros are not padded — "100" and "100.00" are the same value, and a fill of "182.6825" keeps all four places. Computed aggregates are fixed at two. Format for display on the client; do not assume a decimal-place count.
        average_price:
          type: string
          description: |-
            Decimal number as a string. Never parse this into a float.

            Stored prices are serialized verbatim from the database, so trailing zeros are not padded — "100" and "100.00" are the same value, and a fill of "182.6825" keeps all four places. Computed aggregates are fixed at two. Format for display on the client; do not assume a decimal-place count.
          nullable: true
        placed_at:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
        terminal_at:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
          nullable: true
          description: Set once the order can no longer fill. Null while the poll is still watching it.
      required:
        - broker_order_id

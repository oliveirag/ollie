        - opened_at
        - quote
        - quote_age_seconds
        - unrealized_pnl
      additionalProperties: false
    Dashboard:
      type: object
      properties:
        lots:
          type: array
          items:
            $ref: "#/components/schemas/OpenLot"
        totals:
          type: object
          properties:
            cost_basis:
              type: string
              description: |-
                Decimal number as a string. Never parse this into a float.

                Stored prices are serialized verbatim from the database, so trailing zeros are not padded — "100" and "100.00" are the same value, and a fill of "182.6825" keeps all four places. Computed aggregates are fixed at two. Format for display on the client; do not assume a decimal-place count.
            market_value:
              type: string
              description: |-
                Decimal number as a string. Never parse this into a float.

                Stored prices are serialized verbatim from the database, so trailing zeros are not padded — "100" and "100.00" are the same value, and a fill of "182.6825" keeps all four places. Computed aggregates are fixed at two. Format for display on the client; do not assume a decimal-place count.
              nullable: true
            unrealized_pnl:
              type: string
              description: |-
                Decimal number as a string. Never parse this into a float.

                Stored prices are serialized verbatim from the database, so trailing zeros are not padded — "100" and "100.00" are the same value, and a fill of "182.6825" keeps all four places. Computed aggregates are fixed at two. Format for display on the client; do not assume a decimal-place count.
              nullable: true
            realized_pnl:
              type: string
              description: Zero until Phase 3. Nothing closes a position yet, so this is the honest number rather than an invented one. A sell fill currently opens its own lot; matching it against the buy is Phase 3 work.
          required:
            - cost_basis
            - market_value
            - unrealized_pnl
            - realized_pnl
          additionalProperties: false
        quotes_available:
          type: boolean
          description: False when the broker could not be reached; lots then show entry basis only
      required:
        - lots
        - totals
        - quotes_available
      additionalProperties: false
    Settings:
      type: object
      properties:
        kill_switch:
          type: boolean
        execution_mode:
          $ref: "#/components/schemas/ExecutionMode"
        live_trading_enabled:
          type: boolean
          description: From the environment, read-only. The second of the two gates in front of real money; the app renders the mode toggle as locked while this is false.
        autonomy:
          type: boolean
          description: "Phase 5: the runtime half of the autonomy gate. Signals auto-approve after the veto window only while both halves are on."
        autonomy_enabled:
          type: boolean
          description: AUTONOMY_ENABLED from the environment, read-only. The app renders the autonomy toggle as locked while this is false.
        autonomy_veto_minutes:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: How long the owner has to veto before the sweep approves. From the environment.
      required:
        - kill_switch
        - execution_mode
        - live_trading_enabled
        - autonomy
        - autonomy_enabled
        - autonomy_veto_minutes
      additionalProperties: false
    HealthReport:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        database:
          type: string
          enum:
            - up
            - down
        killSwitch:
          type: boolean
          nullable: true
          description: "Effective kill switch: true when either half is on, so the pipeline is halted. Null only when the database is unreachable AND the environment override is off, which is the one case where the answer is genuinely unknown"
        killSwitchEnv:
          type: boolean
          description: The KILL_SWITCH environment override. Clearing it requires a redeploy. Read from config, so it stays truthful even when the database is down
        killSwitchDb:
          type: boolean
          nullable: true
          description: The runtime half in app_settings, flipped from the iOS app with no redeploy; null when the database is unreachable
        executionMode:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ExecutionMode"
        uptimeSeconds:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        checkedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - status
        - database
        - killSwitch
        - killSwitchEnv
        - killSwitchDb
        - executionMode
        - uptimeSeconds
        - checkedAt
      additionalProperties: false
    CurvePoint:
      type: object
      properties:
        date:
          type: string
          description: UTC calendar day, YYYY-MM-DD
        value:
          type: number
          nullable: true
          description: Cumulative realized PnL through this day plus the day's marks. Null when withheld
        withheld:
          type: boolean
          description: True when a lot open on this day had no mark, so no honest total exists. A partial sum would misstate a published curve, so the day is reported as absent rather than approximated
      required:
        - date
        - value
        - withheld
      additionalProperties: false
    TrackRecord:
      type: object
      properties:
        closed_trades:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
        open_positions:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Reported alongside win rate so the exclusion below is visible, not hidden
        wins:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Strictly positive realized PnL; a scratch is not a win
        win_rate:
          type: number
          nullable: true
          description: Wins over closed trades. Open positions are excluded from the denominator because they have no outcome yet. Null with zero closed trades — no answer, rather than a claimed 0%
        average_return:
          type: number
          nullable: true
          description: Unweighted mean of realized_pnl / (entry_price x quantity) over closed trades
        total_realized_pnl:
          type: string
          description: Decimal string, two places
        curve:
          type: array
          items:
            $ref: "#/components/schemas/CurvePoint"
          description: A PnL curve based at zero, not a portfolio value
        live_since:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
          nullable: true
          description: When the first live-money signal was published. Everything before it settled on paper. Null while the whole record is paper.
      required:
        - closed_trades
        - open_positions
        - wins
        - win_rate
        - average_return
        - total_realized_pnl
        - curve
        - live_since
      additionalProperties: false
    Device:
      type: object
      properties:
        id:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        environment:
          type: string
          enum:
            - sandbox
            - production
        last_seen_at:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
      required:
        - id
        - environment
        - last_seen_at
      additionalProperties: false
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness and configuration check
      description: |-
        Reports database reachability and the runtime safety flags as the service currently sees them. The flags are included deliberately: the fastest way to answer "what mode is production actually in" should not be reading deploy variables and hoping they match.

        Returns 503 when the database is unreachable, which is what the platform health check keys on.
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
        "503":
          description: Service degraded — the database is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
  /v1/signals:
    get:
      operationId: listSignals
      summary: List pending or decided signals
      tags:
        - signals
      description: Pending items carry `expires_at`, computed at read time from the current SIGNAL_EXPIRY_MINUTES. The expiry sweep remains the authority on what is actually expired; the timestamp drives the countdown UI and nothing else.
      parameters:
        - schema:
            default: pending
            type: string
            enum:
              - pending
              - decided
          in: query
          name: status
          required: false
          description: pending = awaiting the owner; decided = approved, rejected, or expired
        - schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 200
          in: query
          name: limit
          required: false
          description: Decided list only
      security:
        - ownerToken: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalList"
        "400":
          description: The request failed schema validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid owner token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/signals/{id}:
    get:
      operationId: getSignal
      summary: Full detail for one signal
      tags:
        - signals
      description: Thesis and its source, the computed indicators, the parsed review snapshot (estimated price and any broker alerts), and the append-only status history.
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: id
          required: true
      security:
        - ownerToken: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalDetail"
        "400":
          description: The request failed schema validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid owner token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No signal with that id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/signals/{id}/decision:
    post:
      operationId: decideSignal
      summary: Approve or reject a pending signal
      tags:
        - signals
      description: |-
        Approving runs the executor for the signal's own execution mode and returns the resulting fill; in paper mode that never contacts the broker. Rejecting records the reason and executes nothing.

        A signal that has already left `pending` — decided elsewhere, or expired by the sweep — returns 409 with its current status. That is the system working: the decision is exactly-once at the database tier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequestInput"
      parameters:
        - schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          in: path
          name: id
          required: true
      security:
        - ownerToken: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionResponse"
        "400":
          description: The request failed schema validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid owner token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No signal with that id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already decided or expired, the kill switch is engaged, live mode is not enabled, or a live approval lacks confirm_live
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Approved, but the fill failed — see detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/dashboard:
    get:
      operationId: getDashboard
      summary: Open positions and PnL
      tags:
        - dashboard
      description: |-
        Open lots are the latest track-record row per signal that is still open, each with its entry price, current quote, and unrealized PnL.

        Quotes are best-effort. If the broker is unreachable every lot still returns with `quote: null` and the app shows entry basis only; `quotes_available` says which happened. Quote age is reported so a stale price is never read as current.
      security:
        - ownerToken: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "401":
          description: Missing or invalid owner token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/settings:
    get:
      operationId: getSettings
      summary: Runtime safety flags
      tags:
        - settings
      security:
        - ownerToken: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          description: Missing or invalid owner token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: updateSettings
      summary: Flip the kill switch or the execution mode
      tags:
        - settings
      description: Switching `execution_mode` to live while `LIVE_TRADING_ENABLED` is false returns 409. The toggle exists and is visibly locked, mirroring the executor's own double gate at the API edge — one gate flips at runtime, the other needs a deploy, so neither a bug nor a stray config change opens the path alone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdateInput"
      security:
        - ownerToken: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          description: The request failed schema validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid owner token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Live mode requested while LIVE_TRADING_ENABLED is false, or autonomy while AUTONOMY_ENABLED is false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/devices:
    post:
      operationId: registerDevice
      summary: Register this device for push notifications
      tags:
        - devices
      description: |-
        Idempotent. Re-registering the same token updates its environment and last-seen time rather than creating a second row.

        The response deliberately omits the token: it is write-only from the API's point of view, and the caller already has it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRegistrationInput"
      security:
        - ownerToken: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          description: The request failed schema validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid owner token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/track-record:
    get:
      operationId: getTrackRecord
      summary: Performance to date and the equity curve
      tags:
        - track-record
      description: "Computed from the append-only track-record rows at read time, never stored — a stored copy could drift from the rows it summarises, and drift in published performance is the one failure this product cannot survive.\\n\\nWin rate and average return are null until at least one trade has closed. Curve days on which an open lot had no mark are returned with `withheld: true` and a null value rather than a partial sum."
      security:
        - ownerToken: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackRecord"
        "401":
          description: Missing or invalid owner token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://ollie-production.up.railway.app
    description: Railway

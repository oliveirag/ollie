# XcodeGen manifest. The .xcodeproj is generated from this file and is NOT
# checked in — see .gitignore. Regenerate with `xcodegen` from this directory.
#
# Declarative on purpose (Phase 2 plan, decision 5): adding a source file here
# is a one-line edit, where hand-editing a pbxproj means inventing UUIDs and
# hoping. That difference is what makes the project agent-editable.

name: Ollie

options:
  bundleIdPrefix: com.guilhermeoliveira
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

# Paid Apple Developer Program team (Individual). Automatic signing registers
# the App ID and its capabilities (Sign in with Apple, Push) on first build.
settings:
  base:
    DEVELOPMENT_TEAM: NL5855QHYU
    CODE_SIGN_STYLE: Automatic

packages:
  # Apple's own OpenAPI toolchain. The Swift client is a build product
  # generated from docs/openapi.yaml, never checked-in source, so a backend
  # route change cannot leave a stale client behind.
  swift-openapi-runtime:
    url: https://github.com/apple/swift-openapi-runtime
    from: 1.12.0
  swift-openapi-urlsession:
    url: https://github.com/apple/swift-openapi-urlsession
    from: 1.3.1
  swift-openapi-generator:
    url: https://github.com/apple/swift-openapi-generator
    from: 1.13.0
  # The subscriber API client (Phase 4). A local package because the generator
  # plugin takes one document per target, and docs/openapi-subscriber.yaml is
  # a second document. See SignalAPI/Package.swift.
  SignalAPI:
    path: SignalAPI

targets:
  Ollie:
    type: application
    platform: iOS
    sources:
      # Ollie/Networking/openapi.yaml is a symlink to ../../../docs/openapi.yaml.
      # The generator plugin requires the document inside the target's own
      # source directory and explicitly supports a symlink, which is how the
      # contract stays a single file: a copy under ios/ would be a second
      # source of truth, and the backend's drift test only guards the one.
      - path: Ollie
    dependencies:
      - package: swift-openapi-runtime
        product: OpenAPIRuntime
      - package: swift-openapi-urlsession
        product: OpenAPIURLSession
      - package: SignalAPI
        product: SignalAPI
    buildToolPlugins:
      - plugin: OpenAPIGenerator
        package: swift-openapi-generator
    # Without this XcodeGen writes no .xcscheme, and `xcodebuild -scheme Ollie`
    # fails with "supported platforms ... is empty" — which reads like a missing
    # SDK and is not one.
    scheme:
      testTargets:
        - OllieUITests
      gatherCoverageData: false
    settings:
      base:
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_ENTITLEMENTS: Ollie/Resources/Ollie.entitlements
      configs:
        # `$()` splits the `//` so the build-settings parser does not read the
        # rest of the line as a comment. It expands to nothing.
        Debug:
          OLLIE_BASE_URL: http:/$()/localhost:3000
          OLLIE_SIGNAL_BASE_URL: http:/$()/localhost:3100
        Release:
          OLLIE_BASE_URL: https:/$()/ollie.up.railway.app
          OLLIE_SIGNAL_BASE_URL: https:/$()/ollie-signal.up.railway.app
    info:
      path: Ollie/Resources/Info.plist
      properties:
        CFBundleDisplayName: Ollie
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Resolved per build configuration (see settings below), never a
        # literal: Debug points at the dev machine, Release at the TLS
        # endpoint. Hardcoding localhost here would make it the shipped
        # default, which is exactly the wrong direction for a build that
        # carries a trade-approving credential.
        OllieBaseURL: $(OLLIE_BASE_URL)
        # The subscriber-facing signal service: a separate host on purpose
        # (Phase 4, decision 4). Same per-configuration resolution as above.
        OllieSignalBaseURL: $(OLLIE_SIGNAL_BASE_URL)
        NSAppTransportSecurity:
          # NSAllowsLocalNetworking, deliberately, rather than
          # NSAllowsArbitraryLoads. It permits cleartext only to local hosts —
          # localhost, .local, link-local — and cannot enable cleartext to a
          # public host. The Release build talks HTTPS to Railway and is
          # unaffected by it; a Debug build talks HTTP to the dev machine and
          # needs it.
          NSAllowsLocalNetworking: true

  # Drives the approval flow through the real UI. Not a unit-test target:
  # what needs proving is that the decision surface works, and the backend
  # already has 230 tests for what happens after the tap.
  OllieUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - OllieUITests
    dependencies:
      - target: Ollie
    settings:
      base:
        SWIFT_VERSION: "5.10"
        TEST_TARGET_NAME: Ollie
        GENERATE_INFOPLIST_FILE: YES
